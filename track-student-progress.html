<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/track-student-progress.css">
    <link rel="shortcut icon" href="assets/icons/peerlynx-icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Peerlynx</title>
</head>
<body>
    <nav>
        <div>
            <button class="windowHistory"><i class="fa-solid fa-angle-left"></i></button>
            <div class="header">student tracking:</div>
            <div class="studentName"></div>
            <div class="course">course name: <span class="skilllNameEl"></span></div>
            <div class="statusWrapper">
                <span>Status: <span class="courseStatus"></span></span>
                <button class="changeStatusBtn"></button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="sessionContainer"></div>
    </div>

    <div class="createSessionWrapper">
        <button class="createSessionBtn" disabled>Create new session</button>
    </div>

    <div class="courseCompleted">
       <div class="completedWrapper">
            <button class="closeCourseCompleted"><i class="fa fa-times"></i></button>
            <p>course complete</p>
            <span>great work tutor!</span>
            <img src="./assets/images/badge-removebg.png" alt="" srcset="">
            <div class="badgeWrapper">
                <button class="badgeBtn">Give student a badge</button>
            </div>
       </div>
    </div>
    
    <script type="module" src="src/js/track-student-progress.js"></script>
</body>
</html>
