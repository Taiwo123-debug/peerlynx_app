<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/messenger.css">
    <link rel="stylesheet" href="src/css/message-input.css">
    <link rel="shortcut icon" href="assets/icons/peerlynx-icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <title>PeerLynx</title>
</head>
<body>

    <nav class="chatProfile">
        <div class="back">
            <button class="windowHistory"><i class="fa-solid fa-angle-left"></i></button>
        </div>
        <div class="profileContainer">
            <div class="imageContainer">
                <img src="" onerror="src='./assets/images/no-image.png'" class="recipientImageEl" srcset="">
            </div>
            <div class="namesContainer">
                <span class="recipientNameEl"></span>
                <span class="recipientUserTypeEl"></span>
            </div>
        </div>
    </nav>
    
    <!-- chatboard  -->
    <div class="chatBoardContainer">
        <div class="chatBoard"></div>
    </div>
    
    <!-- chat input  -->
    <div class="chatContainer">
        <div class="chatInputWrapper">
            <textarea class="inputEl" placeholder="Message" rows="1" oninput="this.style.height = '45px'; this.style.height = this.scrollHeight + 'px';"></textarea>
            <button class="sendMessageBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- <div class="audioContainer">
        <audio src="./assets/audios/incoming.mp3" class="incoming" controls></audio>
        <audio src="./assets/audios/outgoing.mp3" class="outgoing" controls></audio>
    </div> -->

    <script type="module" src="src/js/messenger.js"></script>
</body>
</html>
