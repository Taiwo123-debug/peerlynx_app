<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/sign-up.css">
    <link rel="shortcut icon" href="assets/icons/peerlynx-icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>PeerLynx</title>
</head>
<body>
    <div class="container">
        <div class="headers">
            <span class="logo">p</span>
            <span class="texts">Welcome back you've<br>been missed</span>
        </div>
        <div class="more">
            Create new account? <a href="sign-up.html">Sign up</a>
        </div>
        <form class="formContainer">
            <input type="email" class="email" placeholder="Email">
            <div class="passwordWrapper">
                <input type="password" class="password" placeholder="Password">
                <button class="togglePasswordBtn">
                    <img src="./assets/images/eye-close.png" alt="" class="eyeClose">
                    <img src="./assets/images/eye-open.png" alt="" class="eyeOpen">
                </button>
            </div>
            <button class="signInBtn" type="submit">Sign in</button>
            <div class="signMessage"></div>
            <div class="forgotPassword">
                <a href="forgot-password.html">Forgot Your Password?</a>
            </div>
        </form>
    </div>
    
    <script type="module" src="src/js/sign-in.js"></script>
</body>
</html>
