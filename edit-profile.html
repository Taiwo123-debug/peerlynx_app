<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/edit-profile.css">
    <link rel="stylesheet" href="src/css/footer.css">
    <link rel="shortcut icon" href="assets/icons/peerlynx-icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Peerlynx</title>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="profile.html" class="back"><i class="fa-solid fa-angle-left"></i></a>
            <span>Edit profile</span>
        </div>
        <div class="imageContainer">
            <figure>
                <img src="" onerror="src='./assets/images/no-image.png'" srcset="" class="profilePicture">
                <figcaption>
                    <button class="editImageBtn"><i class="fa-regular fa-pen-to-square"></i></button>
                </figcaption>
                <input type="file" accept="image/*" class="imageInput">
            </figure>
        </div>

        <div class="editForm">
            <label for="firstName">first name</label>
            <input type="text" class="firstName">
            <label for="lastName">last name</label>
            <input type="text" class="lastName">
            <label for="university">university</label>
            <input type="text" class="university">
            <label for="mobile">mobile</label>
            <input type="number" class="mobile">
            <div class="editMessage"></div>
            <button class="editBtn">save changes</button>
        </div>
    </div>


    <footer>
        <div class="wrapper">
            <a class="homeBtn">
                <img src="./assets/images/home-icon.png" alt="">
                <span>home</span>
            </a>
            <a class="categoryBtn" href="category.html">
                <img src="./assets/images/categories-icon.png" alt="">
                <span>category</span>
            </a>
            <a class="chatBtn" href="chat.html">
                <img src="./assets/images/chat-icon.png" alt="">
                <span>chat</span>
            </a>
            <a class="offersBtn" href="offers.html">
                <img src="./assets/images/offers-icon.png" alt="">
                <span>offers</span>
            </a>
            <a class="profileBtn" href="profile.html">
                <img src="./assets/images/profile-icon.png" alt="">
                <span style="color: #457588;">profile</span>
            </a>
        </div>
    </footer>
    

    <script type="module" src="src/js/edit-profile.js"></script>
</body>
</html>
