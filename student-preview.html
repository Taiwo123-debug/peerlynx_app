<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/student-preview.css">
    <link rel="shortcut icon" href="assets/icons/peerlynx-icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Peerlynx</title>
</head>
<body>
    <nav>
        <button class="windowHistory"><i class="fa-solid fa-angle-left"></i></button>
    </nav>

    <div class="container">
        <div class="profileHeader">
            <div class="imageContainer">
                <figure>
                    <img src="" onerror="src='./assets/images/no-image.png'" alt="" srcset="" class="recipientPicture">
                </figure>
            </div>
             <div class="userInfo">
                <span class="recipientName"></span>
                <span class="recipientSchool"></span>
            </div>
        </div>

        <div class="profileContacts">
            <div class="contacts">
                <a href="" target="_blank" class="recipientEmailEl"><i class="fa-solid fa-envelope"></i></a>
                <a href="" class="recipientMobileEl"><i class="fa-solid fa-phone"></i></a>
                <button class="backToChat"><i class="fa-solid fa-message"></i></button>
            </div>
        </div>

        <div class="studentSkills">
            <div class="skillHeader"></div>
            <div class="skillsContainer"></div>

            <div class="recommendationHeader"></div>
            <div class="recommendationContainer"></div>
        </div>

        <div class="moreInfo">
            <span class="joinedEl"></span>
        </div>
    </div>
    

    <script type="module" src="src/js/student-preview.js"></script>
</body>
</html>
