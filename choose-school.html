<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/choose-school.css">
    <link rel="shortcut icon" href="assets/icons/peerlynx-icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>PeerLynx</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="text">
                <span class="name">PeerLynx</span>
                <span class="chooseUni">Please choose a university</span>
            </div>
        </div>
        <div class="universitiesContainer">
            <div class="university">
                <div class="locationIcon">
                    <img src="assets/images/location.png" alt="" srcset="" class="location">
                </div>
                <div class="schoolWrapper">
                    <span class="schoolName">Benson Idahosa University</span>
                </div>
                <div class="chooseWrapper">
                    <button></button>
                </div>
            </div>

            <div class="university">
                <div class="locationIcon">
                    <img src="./assets/images/location.png" alt="" srcset="" class="location">
                </div>
                <div class="schoolWrapper">
                    <span class="schoolName">WestBridgers University</span>
                </div>
                <div class="chooseWrapper">
                    <button></button>
                </div>
            </div>

            <div class="university">
                <div class="locationIcon">
                    <img src="./assets/images/location.png" alt="" srcset="" class="location">
                </div>
                <div class="schoolWrapper">
                    <span class="schoolName">Crownfield University</span>
                </div>
                <div class="chooseWrapper">
                    <button></button>
                </div>
            </div>
        </div>

        <div class="userTypeMessage"></div>

        <div class="base">
            <button class="continueSignUp">continue</button>
        </div>
    </div>
    

    <script type="module" src="src/js/choose-school.js"></script>
</body>
</html>
